<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Personal Skills Collection</title>
  <desc id="desc">A restrained technical header showing five composable first-party agent skills around a central collection node.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c32"/>
      <stop offset="1" stop-color="#152542"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b9d8ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#background)"/>
  <rect x="24" y="24" width="1552" height="472" rx="20" fill="url(#grid)"/>
  <path d="M0 420 C260 360 460 470 720 410 S1180 300 1600 380 V520 H0 Z" fill="#08101d" fill-opacity="0.45"/>
  <circle cx="1310" cy="250" r="150" fill="none" stroke="#67e8f9" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="1310" cy="250" r="108" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="1310" cy="250" r="62" fill="#0d1930" stroke="url(#glow)" stroke-width="3" filter="url(#softGlow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M1310 100 V188 M1310 312 V400 M1160 250 H1248 M1372 250 H1460" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M1204 144 L1267 207 M1353 293 L1416 356 M1416 144 L1353 207 M1267 293 L1204 356" stroke="#818cf8" stroke-opacity="0.45" stroke-width="2"/>
  </g>
  <g fill="#c4f1ff" stroke="#67e8f9" stroke-width="2">
    <circle cx="1310" cy="100" r="7"/><circle cx="1310" cy="400" r="7"/>
    <circle cx="1160" cy="250" r="7"/><circle cx="1460" cy="250" r="7"/>
    <circle cx="1204" cy="144" r="6"/><circle cx="1416" cy="356" r="6"/>
    <circle cx="1416" cy="144" r="6"/><circle cx="1204" cy="356" r="6"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#dcecff">
    <text x="88" y="96" font-size="20" letter-spacing="5" fill="#67e8f9">SKILLS / FIRST-PARTY COLLECTION</text>
    <text x="88" y="205" font-size="58" font-weight="700" letter-spacing="1">PERSONAL SKILLS</text>
    <text x="88" y="276" font-size="58" font-weight="700" letter-spacing="1" fill="#a5b4fc">COLLECTION</text>
    <text x="92" y="326" font-size="22" fill="#b7c8df">Composable capabilities for inspectable agent work.</text>
    <text x="1310" y="258" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="3">COMPOSE</text>
    <text x="1310" y="282" text-anchor="middle" font-size="12" letter-spacing="2" fill="#8ca4c2">SELECT • VERIFY • USE</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="0.5">
    <g transform="translate(88 392)">
      <rect width="174" height="42" rx="21" fill="#152944" stroke="#31547c"/>
      <text x="87" y="27" text-anchor="middle" fill="#dcecff">review-loop</text>
    </g>
    <g transform="translate(278 392)">
      <rect width="174" height="42" rx="21" fill="#152944" stroke="#31547c"/>
      <text x="87" y="27" text-anchor="middle" fill="#dcecff">project-init</text>
    </g>
    <g transform="translate(468 392)">
      <rect width="152" height="42" rx="21" fill="#152944" stroke="#31547c"/>
      <text x="76" y="27" text-anchor="middle" fill="#dcecff">ask-light</text>
    </g>
    <g transform="translate(636 392)">
      <rect width="190" height="42" rx="21" fill="#152944" stroke="#31547c"/>
      <text x="95" y="27" text-anchor="middle" fill="#dcecff">learn-anything</text>
    </g>
    <g transform="translate(842 392)">
      <rect width="184" height="42" rx="21" fill="#152944" stroke="#31547c"/>
      <text x="92" y="27" text-anchor="middle" fill="#dcecff">manuscript-ops</text>
    </g>
  </g>
</svg>
