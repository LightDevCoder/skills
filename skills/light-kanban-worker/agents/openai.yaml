interface:
  display_name: "Light Kanban Worker"
  short_description: "Pick up and execute work from Light-Kanban"
  default_prompt: |
    Use light-kanban-worker to process one task from http://127.0.0.1:8641.

    Agent ID: codex-main
    Agent Name: Codex
    Agent Avatar: /path/to/codex-icon.png

policy:
  allow_implicit_invocation: true
