name: collection-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all collection and package tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.4.2'
          python -m pytest -q
          python -m compileall -q skills tests scripts
          python scripts/check_public_docs.py
      - name: Set up Node.js for companion checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run travel page runtime tests and build
        shell: bash
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          node skills/productivity/light-travelpage/scripts/create.mjs "$site/site"
          cd "$site/site"
          npm ci
          npm test
          node tests/prepare-build-fixture.mjs
          npm run validate
          if ! command -v pdftoppm >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          npm run build
          test -s dist/assets/tickets/fixture.png
      - name: Cross-repo Agent Config compatibility check
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(python -c "import json; print(json.load(open('skills/engineering/agent-config/tests/fixtures/schemas/METADATA.json'))['source_revision'])")
          echo "Using canonical companion pin: $PIN"
          mkdir -p /tmp/agent-config-companion
          git init /tmp/agent-config-companion
          (
            cd /tmp/agent-config-companion
            git remote add origin https://github.com/LightDevCoder/agent-config.git
            git fetch --depth 1 origin "$PIN"
            git checkout --detach "$PIN"
            current_head=$(git rev-parse HEAD)
            if [ "$current_head" != "$PIN" ]; then
              echo "Error: Checked out $current_head, expected $PIN"
              exit 1
            fi
            npm ci
          )
          export AGENT_CONFIG_COMPANION_PATH="/tmp/agent-config-companion"
          python -m unittest skills/engineering/agent-config/tests/test_companion_contract_integration.py
      - name: Retired package boundary
        shell: bash
        run: |
          set -euo pipefail
          hits=$(grep -rn --include="*" -E "project-workflow|to-manuscript-spec" skills/ || true)
          if [ -n "$hits" ]; then
            echo "Retired package references remain under skills/:"
            echo "$hits"
            exit 1
          fi
      - name: No PowerShell test files remain
        shell: bash
        run: |
          set -euo pipefail
          count=$(find . -path "*/tests/*.ps1" -not -path "./.git/*" | wc -l | tr -d " ")
          if [ "$count" -ne 0 ]; then
            echo "PowerShell test files still present: $count"
            find . -path "*/tests/*.ps1" -not -path "./.git/*"
            exit 1
          fi
